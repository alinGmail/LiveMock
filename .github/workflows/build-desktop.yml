name: Build desktop packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  # Never block on Corepack's interactive "download Yarn?" prompt in CI.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  # Build unsigned artifacts. Add signing secrets and remove this to sign.
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  build:
    name: Package for ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            args: --linux AppImage --x64 --publish never
          - platform: windows
            os: windows-latest
            args: --win nsis --x64 --publish never
          - platform: macos
            os: macos-latest
            args: >-
              --mac dmg --x64 --arm64 --publish never
              --config.mac.artifactName='${productName}_${version}_mac-${arch}.${ext}'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # setup-node must come first: it puts the runner's Node (and the Corepack
      # shims we enable next) ahead of the preinstalled Yarn 1.22.22.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack
        run: |
          corepack enable
          corepack install --global yarn@4.18.1
          corepack yarn --version

      - name: Install dependencies
        run: corepack yarn install --immutable

      - name: Build core
        run: corepack yarn workspace livemock-core build

      - name: Compile Electron main process
        run: corepack yarn workspace livemock-desktop tsc

      - name: Build renderer
        run: corepack yarn workspace livemock-desktop vite build

      - name: Package
        working-directory: desktop
        run: corepack yarn electron-builder ${{ matrix.args }}

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: livemock-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            desktop/release/**/*.AppImage
            desktop/release/**/*.snap
            desktop/release/**/*.deb
            desktop/release/**/*.exe
            desktop/release/**/*.dmg
            desktop/release/**/*.zip

  release:
    name: Attach packages to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
