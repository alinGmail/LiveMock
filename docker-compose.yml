version: "3.8"

services:
  livemock:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${LIVEMOCK_PORT:-9002}:${LIVEMOCK_PORT:-9002}"
    environment:
      - NODE_ENV=production
      - LIVEMOCK_PORT=${LIVEMOCK_PORT:-9002}
      - LIVEMOCK_DB_PATH=/app/data/db
      - LIVEMOCK_COOKIE_SECURE=${LIVEMOCK_COOKIE_SECURE:-false}
      - LIVEMOCK_TRUST_PROXY=${LIVEMOCK_TRUST_PROXY:-}
    restart: unless-stopped
    volumes:
      - livemock_data:/app/data

volumes:
  livemock_data: